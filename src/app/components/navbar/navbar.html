<nav class="navbar">
  <canvas id="matrix-bg"></canvas>
  <div class="scanline"></div>

  <div class="nav-content">
    <div class="logo">CYBER<span>SCAN</span></div>

    <ul class="nav-links">
      <li><a routerLink="/dashboard" routerLinkActive="active">DASHBOARD</a></li>
      <li><a routerLink="/scanner" routerLinkActive="active">SCANNER</a></li>
      <li><a routerLink="/historique" routerLinkActive="active">HISTORIQUE</a></li>
      <li><a routerLink="/alertes" routerLinkActive="active">ALERTES</a></li>
      <li><a routerLink="/notifications" routerLinkActive="active">NOTIFICATIONS</a></li>
      <li *ngIf="currentUser?.role === 'admin'">
        <a routerLink="/clients" routerLinkActive="active">CLIENTS</a>
      </li>
    </ul>

    <div class="nav-right">
      <a routerLink="/notifications" class="notif-bell" title="Notifications">
        🔔
        <span class="notif-badge-count" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </a>

      <button class="theme-toggle" (click)="toggleTheme()">
        {{ isDark ? '☀ LIGHT' : '☾ DARK' }}
      </button>

      <div class="user-info" *ngIf="currentUser">
        <span class="user-role badge-{{ currentUser.role }}">
          {{ currentUser.role | uppercase }}
        </span>
        <a routerLink="/profile" class="user-name" title="Voir mon profil">
          {{ currentUser.username }}
        </a>
        <button class="logout-btn" (click)="logout()">⏻ LOGOUT</button>
      </div>
    </div>
  </div>
</nav>
