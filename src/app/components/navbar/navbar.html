<nav class="navbar">
  <canvas id="matrix-bg"></canvas>
  <div class="scanline"></div>

  <div class="nav-content">
    <div class="logo">CYBER<span>SCAN</span></div>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Ouvrir le menu de navigation"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <ul id="primary-navigation" class="nav-links" [class.is-open]="isMenuOpen">
      <li><a routerLink="/dashboard" routerLinkActive="active" (click)="closeMenu()">DASHBOARD</a></li>
      <li><a routerLink="/scanner" routerLinkActive="active" (click)="closeMenu()">SCANNER</a></li>
      <li><a routerLink="/historique" routerLinkActive="active" (click)="closeMenu()">HISTORIQUE</a></li>
      <li><a routerLink="/alertes" routerLinkActive="active" (click)="closeMenu()">ALERTES</a></li>
      <li *ngIf="currentUser?.role === 'admin'">
        <a routerLink="/clients" routerLinkActive="active" (click)="closeMenu()">CLIENTS</a>
      </li>
    </ul>

    <div class="nav-right">
      <span class="notif-bell" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
          <path d="M10 21h4"></path>
        </svg>
        <span class="notif-badge-count" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </span>

      <button class="theme-toggle" (click)="toggleTheme()">
        {{ isDark ? '☀ LIGHT' : '☾ DARK' }}
      </button>

      <div class="user-info" *ngIf="currentUser">
        <a routerLink="/profile" class="user-name" title="Voir mon profil">
          <svg class="user-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 21a8 8 0 0 0-16 0"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          {{ currentUser.username }}
        </a>
        <button class="logout-btn" (click)="logout()">⏻ LOGOUT</button>
      </div>
    </div>
  </div>
</nav>
